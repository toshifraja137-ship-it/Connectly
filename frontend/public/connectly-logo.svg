<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Chat bubble -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="80" height="55" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="6" y="6" width="68" height="38" rx="6" fill="#f1f5f9" opacity="0.8"/>
    <circle cx="20" cy="25" r="4" fill="#6366f1"/>
    <circle cx="36" cy="25" r="4" fill="#6366f1"/>
    <circle cx="52" cy="25" r="4" fill="#6366f1"/>
  </g>

  <!-- Typing indicator -->
  <g transform="translate(75, 125)">
    <circle cx="8" cy="6" r="3" fill="#6366f1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="6" r="3" fill="#6366f1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="6" r="3" fill="#6366f1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connecting line -->
  <path d="M 40 140 Q 100 170 160 140" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>